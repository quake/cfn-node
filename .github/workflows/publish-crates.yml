name: Publish Crates

on:
  push:
    tags:
      - 'crates-publish/*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2

      # fiber-types has no internal workspace dependencies, publish first
      - name: Publish fiber-types
        run: cargo publish -p fiber-types --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # fiber-store has no internal workspace dependencies
      - name: Publish fiber-store
        run: cargo publish -p fiber-store --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # fiber-json-types optionally depends on fiber-types, publish last
      - name: Publish fiber-json-types
        run: cargo publish -p fiber-json-types --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
